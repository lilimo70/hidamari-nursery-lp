<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>陽だまりの森保育園 | 採用サイト</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@600&family=Noto+Sans+JP:wght@400&family=Montserrat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header class="header">
    <div class="header__inner">
      <div class="header__logo">
        <!-- SVG tree logo inline -->
        <svg width="36" height="40" viewBox="0 0 36 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <ellipse cx="18" cy="10" rx="10" ry="10" fill="#7BAF8A"/>
          <ellipse cx="11" cy="16" rx="8" ry="8" fill="#9DC4A0"/>
          <ellipse cx="25" cy="16" rx="8" ry="8" fill="#6B9E7A"/>
          <rect x="15" y="26" width="6" height="12" rx="2" fill="#C4956A"/>
        </svg>
        <span class="header__logo-name">陽だまりの森保育園</span>
        <span class="header__logo-divider">｜</span>
        <span class="header__logo-sub">採用サイト</span>
      </div>

      <nav class="header__nav">
        <ul class="header__nav-list">
          <li><a href="#" class="header__nav-link">私たちの保育</a></li>
          <li><a href="#" class="header__nav-link">働く魅力</a></li>
          <li><a href="#" class="header__nav-link">1日の流れ</a></li>
          <li><a href="#" class="header__nav-link">先輩の声</a></li>
          <li><a href="#" class="header__nav-link">募集要項</a></li>
          <li><a href="#" class="header__nav-link">よくある質問</a></li>
        </ul>
      </nav>

      <a href="#" class="btn-entry btn-entry--header">園見学を申し込む</a>
    </div>
  </header>

  <!-- ========== HERO ========== -->
  <section class="hero">
    <div class="hero__inner">
      <div class="hero__visual">

        <!-- 背景の緑のblobシェイプ -->
        <div class="bg-shape-green" aria-hidden="true"></div>

        <!-- 緑のドット装飾 -->
        <div class="hero__dots" aria-hidden="true">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>

        <!-- メイン写真 -->
        <div class="photo-main">
          <img src="assets/images/hero-main.jpg" alt="先生と子どもが積み木で遊んでいる様子">
        </div>

        <!-- キャッチコピー -->
        <div class="hero__catchcopy">
          <p class="hero__catchcopy-label">NURSERY SCHOOL RECRUITMENT</p>
          <h1 class="hero__catchcopy-heading">
            <span>先生にも</span>
            <span>子どもにも</span>
            <span>優しい保育</span>
          </h1>
        </div>

        <!-- 小規模バッジ -->
        <div class="badge-small-nursery">
          <p class="badge-small-nursery__title">小規模</p>
          <p class="badge-small-nursery__desc">定員40名の<br>小規模保育</p>
        </div>

        <!-- エントリーボタン -->
        <a href="#" class="btn-entry btn-entry--hero">園見学を申し込む</a>

      </div>
    </div>
  </section>

  <!-- ========== MESSAGE ========== -->
  <section class="message">
    <div class="message__inner">

      <!-- ビジュアル（左） -->
      <div class="message__visual">
        <div class="bg-circle" aria-hidden="true"></div>
        <div class="photo-top">
          <img src="assets/images/message-photo-top.png" alt="先生と子どもが遊んでいる様子">
        </div>
        <div class="photo-left">
          <img src="assets/images/message-photo-left.png" alt="先生と子どもが工作している様子">
        </div>
        <div class="photo-bottom">
          <img src="assets/images/message-photo-bottom.png" alt="先生が赤ちゃんを抱っこしている様子">
        </div>
      </div>

      <!-- テキスト（右） -->
      <div class="message__text">
        <div class="message__heading-block">
          <p class="label-en">MESSAGE</p>
          <h2 class="message__heading">
            陽だまり森の<br>保育スタイル
          </h2>
        </div>
        <p class="message__body">
          土・水・草花・虫・季節の変化にふれながら、子どもたちの「やってみたい！」を大切にする保育。<br>
          少人数だからこそ、一人ひとりのペースで丁寧に向き合えます。保育士も無理なく、自分らしく働ける環境を整えています。
        </p>
      </div>

    </div>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
